<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic 投资工作台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --border: #e8e9f0;
      --text: #1a1a2e;
      --text-sub: #6b7280;
      --accent: #3b82f6;
      --up: #10b981;
      --down: #ef4444;
      --warn: #f59e0b;
      --radius: 12px;
      --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-hover: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
    }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .last-updated { font-size: 12px; color: var(--text-sub); }
    .market-time {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .market-time.trading { background: #d1fae5; color: #065f46; }
    .market-time.closed { background: #fef3c7; color: #92400e; }
    .market-time.weekend { background: #e0e7ff; color: #3730a3; }

    /* ── Container ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }

    /* ── Grid ── */
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-main { grid-template-columns: 2fr 3fr; }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: var(--shadow-hover); }
    .card-header {
      padding: 12px 18px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .card-body { padding: 16px 18px; }

    /* ── Index Gauge ── */
    .index-gauge { text-align: center; padding: 20px 18px; }
    .index-value { font-size: 40px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
    .index-change { font-size: 15px; font-weight: 600; margin-top: 4px; }
    .index-change.up { color: var(--up); }
    .index-change.down { color: var(--down); }
    .index-meta {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .gauge-wrap { margin-top: 16px; }
    .gauge-track {
      background: var(--border);
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
      position: relative;
    }
    .gauge-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--accent) 0%, #60a5fa 100%);
      transition: width 0.8s ease;
    }
    .gauge-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--text-sub); }
    .tech-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    .tech-item { background: var(--bg); border-radius: 8px; padding: 10px 8px; text-align: center; }
    .tech-label { font-size: 10px; color: var(--text-sub); margin-bottom: 3px; }
    .tech-value { font-size: 15px; font-weight: 700; }
    .tech-value.up { color: var(--up); }
    .tech-value.down { color: var(--down); }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-up { background: #d1fae5; color: #065f46; }
    .badge-down { background: #fee2e2; color: #991b1b; }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-neutral { background: #e0e7ff; color: #3730a3; }

    /* ── Position ── */
    .pos-list { display: flex; flex-direction: column; gap: 8px; }
    .pos-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; background: var(--bg); border-radius: 8px;
    }
    .pos-info { display: flex; flex-direction: column; gap: 1px; }
    .pos-name { font-weight: 600; font-size: 13px; }
    .pos-code { font-size: 11px; color: var(--text-sub); }
    .pos-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .pos-pl { font-weight: 700; font-size: 15px; }
    .pos-date { font-size: 10px; color: var(--text-sub); }
    .pos-empty { text-align: center; padding: 20px; color: var(--text-sub); font-size: 13px; }

    /* ── Pool Summary ── */
    .pool-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .pool-stat { text-align: center; padding: 12px 8px; background: var(--bg); border-radius: 8px; }
    .pool-stat-num { font-size: 24px; font-weight: 800; line-height: 1; }
    .pool-stat-label { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
    .pool-stat.good .pool-stat-num { color: var(--up); }
    .pool-stat.bad .pool-stat-num { color: var(--down); }
    .pool-stat.neutral .pool-stat-num { color: var(--text-sub); }

    /* ── Pool List ── */
    .pool-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
    .pool-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--bg); border-radius: 8px;
      cursor: pointer; transition: background 0.15s;
    }
    .pool-item:hover { background: #eef1fa; }
    .pool-code { font-weight: 700; font-size: 12px; min-width: 52px; }
    .pool-name { flex: 1; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pool-board { font-size: 10px; color: var(--text-sub); min-width: 40px; text-align: right; }
    .pool-tag { flex-shrink: 0; }

    /* ── Events ── */
    .event-list { display: flex; flex-direction: column; gap: 8px; }
    .event-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; background: var(--bg); border-radius: 8px;
    }
    .event-date {
      font-size: 11px; font-weight: 700; color: var(--accent);
      min-width: 44px; padding-top: 1px;
    }
    .event-text { font-size: 13px; flex: 1; line-height: 1.5; }
    .event-stock { color: var(--accent); font-weight: 600; }
    .event-countdown {
      font-size: 11px; padding: 2px 7px; border-radius: 20px;
      background: #fef3c7; color: #92400e; white-space: nowrap; flex-shrink: 0;
    }
    .event-countdown.soon { background: #fee2e2; color: #991b1b; }

    /* ── Section ── */
    .section-label {
      font-size: 11px; color: var(--text-sub);
      padding: 14px 0 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Quick Actions ── */
    .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 8px; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; font-size: 12px; font-weight: 500;
      color: var(--text); text-decoration: none;
      transition: all 0.15s; text-align: center;
    }
    .action-btn:hover { background: #eef1fa; border-color: var(--accent); color: var(--accent); }
    .action-icon { font-size: 22px; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border-radius: 16px;
      max-width: 480px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-close { font-size: 20px; cursor: pointer; color: var(--text-sub); background: none; border: none; }
    .modal-body { padding: 20px; }
    .modal-stock-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .modal-stock-name { font-size: 18px; font-weight: 800; }
    .modal-stock-code { font-size: 13px; color: var(--text-sub); }
    .modal-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .modal-row:last-child { border-bottom: none; }
    .modal-label { font-size: 13px; color: var(--text-sub); }
    .modal-value { font-size: 13px; font-weight: 600; }

    /* ── Afternoon Brief ── */
    .afternoon-loading { text-align: center; padding: 24px; color: var(--text-sub); font-size: 13px; }
    .afternoon-section { margin-bottom: 14px; }
    .afternoon-section:last-child { margin-bottom: 0; }
    .afternoon-section-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .afternoon-item { padding: 7px 10px; background: var(--bg); border-radius: 7px; margin-bottom: 5px; font-size: 13px; line-height: 1.6; }
    .afternoon-item:last-child { margin-bottom: 0; }
    .afternoon-meta { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .afternoon-empty { text-align: center; padding: 20px; color: var(--text-sub); font-size: 13px; }
    .afternoon-day { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .afternoon-day.open { border-color: var(--accent); }
    .afternoon-day-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; background: var(--bg); user-select: none; }
    .afternoon-day-header:hover { background: #eef1fa; }
    .af-day-dot { font-size: 10px; color: var(--accent); min-width: 12px; }
    .af-day-date { font-weight: 700; font-size: 13px; flex: 1; }
    .af-day-time { font-size: 11px; color: var(--text-sub); }
    .af-day-arrow { font-size: 11px; color: var(--text-sub); }
    .afternoon-day-body { padding: 12px 14px; border-top: 1px solid var(--border); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid-2, .grid-3, .grid-4, .grid-main { grid-template-columns: 1fr; }
      .pool-summary { grid-template-columns: 1fr 1fr 1fr; }
      .tech-grid { grid-template-columns: 1fr 1fr 1fr; }
      .action-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .container { padding: 12px 12px 32px; }
      .pool-summary { gap: 6px; }
      .pool-stat { padding: 8px 4px; }
      .pool-stat-num { font-size: 20px; }
      .tech-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>

    <div class="logo">🌅 Romantic <span>投资工作台</span></div>
    <div class="header-right">

    </div>
  </header>

  <div class="container">

    <!-- Row 1: 沪指 + 持仓 -->
    <div class="grid grid-2">
      <!-- 沪指 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">📊 沪指大盘</span>
          <span class="badge badge-neutral" id="indexDate">--</span>
        </div>
        <div class="card-body" style="padding:0">
          <div class="index-gauge">
            <div class="index-value" id="indexValue">--</div>
            <div class="index-change" id="indexChange">--</div>
            <div class="index-meta">
              <span id="indexSz">深证 --</span>
              <span id="indexCy">创业板 --</span>
              <span id="indexKc">科创50 --</span>
            </div>
            <div class="gauge-wrap">
              <div class="gauge-track">
                <div class="gauge-fill" id="gaugeFill" style="width:50%"></div>
              </div>
              <div class="gauge-labels">
                <span id="gaugeMin">支撑</span>
                <span id="gaugePos">当前位置</span>
                <span id="gaugeMax">压力</span>
              </div>
            </div>
            <div class="tech-grid">
              <div class="tech-item">
                <div class="tech-label">支撑</div>
                <div class="tech-value up" id="supportLevel">--</div>
              </div>
              <div class="tech-item">
                <div class="tech-label">压力</div>
                <div class="tech-value down" id="resistLevel">--</div>
              </div>
              <div class="tech-item">
                <div class="tech-label">成交额</div>
                <div class="tech-value" id="volume">--</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 持仓 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">⭐ 持仓状态</span>
          <span class="badge badge-neutral" id="positionCount">--</span>
        </div>
        <div class="card-body">
          <div class="pos-list" id="positionList">
            <div class="pos-empty">暂无持仓，随时准备入场</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Row 2: 池子 + 事件 -->
    <div class="section-label">数据池</div>
    <div class="grid grid-main">
      <div class="card">
        <div class="card-header">
          <span class="card-title">🔥 AI算力池</span>
          <span class="badge badge-neutral" id="poolCount">--</span>
        </div>
        <div class="card-body">
          <div class="pool-summary" id="poolSummary">
            <div class="pool-stat good">
              <div class="pool-stat-num" id="poolGood">--</div>
              <div class="pool-stat-label">💡 利好</div>
            </div>
            <div class="pool-stat bad">
              <div class="pool-stat-num" id="poolBad">--</div>
              <div class="pool-stat-label">⚠️ 利空</div>
            </div>
            <div class="pool-stat neutral">
              <div class="pool-stat-num" id="poolNeutral">--</div>
              <div class="pool-stat-label">✅ 无公告</div>
            </div>
          </div>
          <div class="pool-list" id="poolList">加载中...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">📅 中报事件</span>
          <span class="badge badge-warn" id="eventCount">--</span>
        </div>
        <div class="card-body">
          <div class="event-list" id="eventList">加载中...</div>
        </div>
      </div>
    </div>

    <!-- 午盘快讯 -->
    <div class="section-label">午盘快讯</div>
    <div class="card" id="afternoonCard">
      <div class="card-header">
        <span class="card-title">📡 午盘快讯</span>
        <span class="badge badge-warn" id="afternoonTime">--:--</span>
      </div>
      <div class="card-body" id="afternoonContent">
        <div class="afternoon-loading">⏳ 午盘简报生成中，14:00后自动更新...</div>
      </div>
    </div>

    <!-- Row 3: 快捷操作 -->
    <div class="section-label">快捷操作</div>
    <div class="grid grid-4">
      <button class="action-btn" onclick="showAction('morning')">
        <span class="action-icon">🌅</span>早盘简报
      </button>
      <button class="action-btn" onclick="showAction('afternoon')">
        <span class="action-icon">☀️</span>午盘速递
      </button>
      <button class="action-btn" onclick="showAction('evening')">
        <span class="action-icon">🌙</span>晚盘汇总
      </button>
      <button class="action-btn" onclick="showAction('tencent')">
        <span class="action-icon">📄</span>腾讯文档
      </button>
    </div>

  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">个股详情</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

    const AFTERMNOON_DATA = [];

    // ── 初始化 ──
    function init() {
      updateMarketTime();
      renderPositions();
      renderPool();
      renderEvents();
      renderAfternoon();
      // 从 URL 参数或缓存读沪指（联网版由脚本注入）
      if (typeof INDEX_DATA !== 'undefined') {
        renderIndex(INDEX_DATA);
      }
      document.getElementById('lastUpdated').textContent =
        '更新: ' + new Date().toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    }

    // ── 交易时间判断 ──
    function updateMarketTime() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const el = document.getElementById('marketTime');
      if (d === 0 || d === 6) {
        el.textContent = '周末'; el.className = 'market-time weekend';
      } else if ((h > 9 || (h === 9 && m >= 30)) && (h < 15 || (h === 15 && m === 0))) {
        el.textContent = '交易中'; el.className = 'market-time trading';
      } else {
        el.textContent = '已休市'; el.className = 'market-time closed';
      }
    }

    // ── 沪指渲染 ──
    function renderIndex(d) {
      document.getElementById('indexValue').textContent = d.value;
      const chgEl = document.getElementById('indexChange');
      chgEl.textContent = (d.up ? '▲ ' : '▼ ') + d.change + '%';
      chgEl.className = 'index-change ' + (d.up ? 'up' : 'down');
      document.getElementById('indexDate').textContent = d.date;
      document.getElementById('indexSz').textContent = '深证 ' + d.sz;
      document.getElementById('indexCy').textContent = '创业板 ' + d.cy;
      document.getElementById('indexKc').textContent = '科创50 ' + d.kc;
      document.getElementById('supportLevel').textContent = d.support;
      document.getElementById('resistLevel').textContent = d.resist;
      document.getElementById('volume').textContent = d.volume;
      document.getElementById('gaugeMin').textContent = d.support;
      document.getElementById('gaugeMax').textContent = d.resist;
      document.getElementById('gaugePos').textContent = d.value;
      const pct = Math.min(100, Math.max(0,
        ((d.value - d.support) / (d.resist - d.support)) * 100
      ));
      document.getElementById('gaugeFill').style.width = pct + '%';
    }

    // ── 持仓渲染 ──
    function renderPositions() {
      const active = []; // 当前持仓（清空了）
      const history = HISTORY_DATA;
      const countEl = document.getElementById('positionCount');
      const listEl = document.getElementById('positionList');

      if (active.length === 0 && history.length > 0) {
        countEl.textContent = '历史持仓';
        countEl.className = 'badge badge-neutral';
        listEl.innerHTML = history.map(h => `
          <div class="pos-item">
            <div class="pos-info">
              <span class="pos-name">${h.name}</span>
              <span class="pos-code">${h.code} · ${h.action}</span>
            </div>
            <div class="pos-meta">
              <span class="pos-pl ${h.pl > 0 ? 'up' : 'down'}" style="color:var(--${h.pl > 0 ? 'up' : 'down'})">
                ${h.pl > 0 ? '+' : ''}${h.pl}%
              </span>
              <span class="pos-date">${h.date}</span>
            </div>
          </div>
        `).join('');
      } else if (active.length === 0) {
        countEl.textContent = '空仓';
        countEl.className = 'badge badge-neutral';
        listEl.innerHTML = '<div class="pos-empty">暂无持仓，随时准备入场</div>';
      }
    }

    // ── 池子渲染 ──
    function renderPool() {
      const summary = POOL_DATA.summary;
      document.getElementById('poolGood').textContent = summary.good;
      document.getElementById('poolBad').textContent = summary.bad;
      document.getElementById('poolNeutral').textContent = summary.neutral;
      document.getElementById('poolCount').textContent = summary.total + ' 只';

      const listEl = document.getElementById('poolList');
      listEl.innerHTML = POOL_DATA.stocks.map(s => `
        <div class="pool-item" onclick="showStock('${s.code}')">
          <span class="pool-code">${s.code}</span>
          <span class="pool-name">${s.name}</span>
          <span class="pool-board">${s.board}</span>
          <span class="pool-tag">
            <span class="badge badge-${s.tag === '💡' ? 'up' : s.tag === '⚠️' ? 'down' : 'neutral'}">${s.tag}</span>
          </span>
        </div>
      `).join('');
    }

    // ── 事件渲染 ──
    function renderEvents() {
      const events = [{"date": "08/20", "text": "宝信软件", "icon": "📊"}, {"date": "08/22", "text": "宁波建工、四创电子、三变科技", "icon": "📊"}, {"date": "08/25", "text": "恒润股份", "icon": "📊"}, {"date": "08/26", "text": "中科曙光、华勤技术、中电鑫龙、雅克科技、中通国脉", "icon": "📊"}, {"date": "08/27", "text": "光环新网、ST中安、圣阳股份、测绘股份", "icon": "📊"}, {"date": "08/28", "text": "科华数据、润泽科技、东方国信", "icon": "📊"}, {"date": "08/29", "text": "天融信", "icon": "📊"}];
      const now = new Date();
      const today = now.getMonth() * 100 + now.getDate();

      document.getElementById('eventCount').textContent = events.length + ' 个';

      const listEl = document.getElementById('eventList');
      listEl.innerHTML = events.map(e => {
        const [m, d] = e.date.split('/').map(Number);
        const evtDay = m * 100 + d;
        const daysLeft = Math.round((new Date(2026, m-1, d) - now) / 86400000);
        const countdown = daysLeft >= 0 ? daysLeft + '天后' : '已过';
        const isSoon = daysLeft >= 0 && daysLeft <= 3;

        return `
          <div class="event-item">
            <span class="event-date">${e.date}</span>
            <span class="event-text">${e.text}</span>
            <span class="event-countdown ${isSoon ? 'soon' : ''}">${countdown}</span>
          </div>
        `;
      }).join('');
    }

    // ── 午盘快讯渲染（历史列表+展开）──
    function renderAfternoon() {
      const list = AFTERMNOON_DATA;
      const el = document.getElementById('afternoonContent');
      const timeEl = document.getElementById('afternoonTime');
      
      if (!list || list.length === 0) {
        el.innerHTML = '<div class="afternoon-empty">⏳ 暂无午盘记录，14:00后自动更新...</div>';
        timeEl.textContent = '--:--';
        return;
      }
      
      // 今天日期
      const today = new Date();
      const todayStr = String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
      
      // 默认展开今天，其他折叠
      el.innerHTML = list.map((day, i) => {
        const isToday = day.date === todayStr;
        const isOpen = isToday;
        const dot = isToday ? '●' : '○';
        return `
          <div class="afternoon-day ${isOpen ? 'open' : ''}" id="afDay${i}">
            <div class="afternoon-day-header" onclick="toggleAfDay(${i})">
              <span class="af-day-dot">${dot}</span>
              <span class="af-day-date">${day.date}</span>
              <span class="af-day-time">${day.time}</span>
              <span class="af-day-arrow">${isOpen ? '▼' : '▶'}</span>
            </div>
            <div class="afternoon-day-body" id="afBody${i}" style="display:${isOpen?'block':'none'}">
              ${day.content.length > 0 ? day.content.map(sec => `
                <div class="afternoon-section">
                  <div class="afternoon-section-title">${sec.icon} ${sec.title}</div>
                  ${sec.items.map(item => `
                    <div class="afternoon-item">
                      ${item.text}
                      ${item.meta ? `<div class="afternoon-meta">（${item.meta}）</div>` : ''}
                    </div>
                  `).join('')}
                </div>
              `).join('') : '<div class="afternoon-empty" style="padding:12px">内容为空</div>'}
            </div>
          </div>
        `;
      }).join('');
      
      timeEl.textContent = list.length + '天记录';
    }

    function toggleAfDay(i) {
      const header = document.querySelector(`#afDay${i} .afternoon-day-header`);
      const body = document.getElementById(`afBody${i}`);
      const arrow = header.querySelector('.af-day-arrow');
      const dot = header.querySelector('.af-day-dot');
      const isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      arrow.textContent = isOpen ? '▶' : '▼';
      dot.textContent = isOpen ? '○' : '●';
    }

    // ── 个股详情弹窗 ──
    function showStock(code) {
      const stock = POOL_DATA.stocks.find(s => s.code === code);
      if (!stock) return;

      const boards = {
        '💡': { cls: 'up', text: '利好' },
        '⚠️': { cls: 'down', text: '利空' },
        '✅': { cls: 'neutral', text: '无重大公告' }
      };
      const b = boards[stock.tag] || boards['✅'];

      document.getElementById('modalTitle').textContent = stock.name;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-stock-header">
          <div>
            <div class="modal-stock-name">${stock.name}</div>
            <div class="modal-stock-code">${stock.code} · ${stock.board}</div>
          </div>
          <span class="badge badge-${b.cls}">${stock.tag} ${b.text}</span>
        </div>
        <div class="modal-row">
          <span class="modal-label">所属板块</span>
          <span class="modal-value">${stock.board}</span>
        </div>
        <div class="modal-row">
          <span class="modal-label">状态</span>
          <span class="modal-value" style="color:var(--${b.cls})">${b.text}</span>
        </div>
        ${stock.highlight ? `
        <div class="modal-row">
          <span class="modal-label">重点摘要</span>
          <span class="modal-value">${stock.highlight}</span>
        </div>` : ''}
        ${stock.risk ? `
        <div class="modal-row">
          <span class="modal-label">风险提示</span>
          <span class="modal-value" style="color:var(--down)">${stock.risk}</span>
        </div>` : ''}
      `;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // ── 快捷操作 ──
    function showAction(type) {
      const now = new Date();
      const dateStr = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');

      if (type === 'morning') {
        document.getElementById('modalTitle').textContent = '🌅 早盘简报 ' + (MORNING_BRIEF ? MORNING_BRIEF.date : dateStr);
        if (MORNING_BRIEF && MORNING_BRIEF.raw) {
          let html = '<div style="font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:70vh;overflow-y:auto;">';
          html += '<div style="margin-bottom:14px;padding:12px;background:var(--bg);border-radius:9px;">';
          if (MORNING_BRIEF.news && MORNING_BRIEF.news.length) {
            html += '<div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;">📰 核心动态</div>';
            MORNING_BRIEF.news.forEach(n => {
              html += '<div style="margin-bottom:6px;padding:6px 8px;background:#fff;border-radius:6px;font-size:12px;">' + n + '</div>';
            });
          }
          if (MORNING_BRIEF.focus_stocks && MORNING_BRIEF.focus_stocks.length) {
            html += '<div style="font-size:12px;font-weight:700;color:var(--accent);margin:12px 0 8px;">⭐ 重点关注</div>';
            MORNING_BRIEF.focus_stocks.forEach(s => {
              html += '<div style="margin-bottom:4px;font-size:13px;">📌 ' + s.name + ' (' + s.code + ')</div>';
            });
          }
          if (MORNING_BRIEF.ops && MORNING_BRIEF.ops.length) {
            html += '<div style="font-size:12px;font-weight:700;color:var(--accent);margin:12px 0 8px;">⚠️ 操作提醒</div>';
            MORNING_BRIEF.ops.forEach(o => {
              html += '<div style="margin-bottom:4px;font-size:12px;color:#c00;">' + o + '</div>';
            });
          }
          html += '</div></div>';
          document.getElementById('modalBody').innerHTML = html;
        } else {
          document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-sub);">⏳ 暂无早盘简报数据<br><br>早盘简报将于08:20自动生成</div>';
        }
      } else if (type === 'afternoon') {
        document.getElementById('modalTitle').textContent = '☀️ 午盘速递 ' + dateStr;
        if (AFTERMNOON_DATA && AFTERMNOON_DATA.length) {
          let html = '';
          AFTERMNOON_DATA.forEach(day => {
            html += '<div style="margin-bottom:16px;">';
            html += '<div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;">📅 ' + day.date + ' ' + day.time + '</div>';
            if (day.content && day.content.length) {
              day.content.forEach(sec => {
                html += '<div style="margin-bottom:10px;">';
                html += '<div style="font-size:12px;font-weight:600;margin-bottom:4px;">' + sec.icon + ' ' + sec.title + '</div>';
                if (sec.items) sec.items.forEach(item => {
                  html += '<div style="font-size:12px;margin-bottom:3px;padding:4px 6px;background:var(--bg);border-radius:5px;">' + item.text + (item.meta ? ' <span style="color:var(--text-sub)">(' + item.meta + ')</span>' : '') + '</div>';
                });
                html += '</div>';
              });
            }
            html += '</div>';
          });
          document.getElementById('modalBody').innerHTML = html;
        } else {
          document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-sub);">⏳ 午盘简报将在14:00自动生成并发送</div>';
        }
      } else if (type === 'evening') {
        document.getElementById('modalTitle').textContent = '🌙 晚盘汇总 ' + dateStr;
        document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-sub);">⏳ 晚盘汇总将在23:45自动生成并发送<br><br>如需现在查看今日涨停，请告诉我「今日涨停」</div>';
      } else if (type === 'tencent') {
        document.getElementById('modalTitle').textContent = '📄 腾讯文档';
        document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:16px;"><div style="margin-bottom:12px;font-size:13px;">投资工作台</div><a href="https://docs.qq.com/page/DYmpPaVdTZmNzd1ND" target="_blank" style="display:inline-block;padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-size:14px;">📋 打开腾讯文档</a></div>';
      }

      document.getElementById('modal').classList.add('show');
    }

    init();
  </script>
</body>
</html>
